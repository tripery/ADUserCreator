services:
  webui:
    build:
      context: ./webui-react
      dockerfile: Dockerfile

    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - ./webui-react:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: npm run dev -- --host 0.0.0.0
